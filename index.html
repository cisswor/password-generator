<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background 0.3s, color 0.3s;
        }

        body.light {
            background: #f1f5f9;
            color: #1e293b;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
            transition: background 0.3s, border-color 0.3s;
        }

        body.light .card {
            background: #ffffff;
            border-color: #e2e8f0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8fafc;
        }

        body.light h1 {
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .theme-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        body.light .theme-btn {
            background: #f1f5f9;
            border-color: #e2e8f0;
            color: #64748b;
        }

        .theme-btn:hover {
            border-color: #6366f1;
            color: #6366f1;
        }

        .password-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 1rem;
            transition: background 0.3s;
        }

        body.light .password-box {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        #password-output {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #6366f1;
            word-break: break-all;
            flex: 1;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #334155;
            color: #f8fafc;
        }

        .copy-btn.copied {
            border-color: #22c55e;
            color: #22c55e;
        }

        body.light .copy-btn {
            border-color: #e2e8f0;
            color: #64748b;
        }

        body.light .copy-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: #0f172a;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        body.light .strength-bar {
            background: #e2e8f0;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }

        .strength-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.4rem;
            text-align: right;
        }

        #crack-time {
            font-size: 0.82rem;
            margin-bottom: 1rem;
            font-weight: 500;
            text-align: right;
        }

        .strength-tips {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 1.4rem;
            display: none;
        }

        body.light .strength-tips {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .strength-tips.visible {
            display: block;
        }

        .strength-tips p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .strength-tips p:last-child {
            margin-bottom: 0;
        }

        .strength-tips p::before {
            content: '→ ';
            color: #6366f1;
        }

        .option-row {
            margin-bottom: 1.4rem;
        }

        .option-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .option-label span:last-child {
            color: #6366f1;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .toggles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        body.light .toggle-item {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .toggle-item:hover {
            border-color: #6366f1;
        }

        .toggle-item.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .toggle-item span {
            font-size: 0.88rem;
            color: #94a3b8;
        }

        body.light .toggle-item span {
            color: #64748b;
        }

        .exclude-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            margin-bottom: 1.4rem;
            transition: border-color 0.2s;
        }

        body.light .exclude-row {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .exclude-row:hover {
            border-color: #6366f1;
        }

        .exclude-row span {
            font-size: 0.88rem;
            color: #94a3b8;
        }

        .exclude-row .hint {
            font-size: 0.78rem;
            color: #475569;
            margin-top: 2px;
        }

        body.light .exclude-row span {
            color: #64748b;
        }

        .toggle {
            width: 36px;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle.on {
            background: #6366f1;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }

        .toggle.on::after {
            transform: translateX(16px);
        }

        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.8rem;
        }

        .preset-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        body.light .preset-btn {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #64748b;
        }

        .preset-btn:hover {
            border-color: #6366f1;
            color: #f8fafc;
        }

        .preset-btn.active {
            border-color: #6366f1;
            background: #6366f1;
            color: #fff;
        }

        .preset-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        body.light .preset-label {
            color: #64748b;
        }

        .mode-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .mode-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        body.light .mode-btn {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #64748b;
        }

        .mode-btn:hover {
            border-color: #6366f1;
            color: #f8fafc;
        }

        .mode-btn.active {
            border-color: #6366f1;
            background: #6366f1;
            color: #fff;
        }

        .mode-hint {
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 1.4rem;
            line-height: 1.5;
        }

        .generate-btn {
            width: 100%;
            padding: 0.85rem;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 1.4rem;
        }

        .generate-btn:hover {
            opacity: 0.88;
        }

        .history-section {
            margin-top: 0.5rem;
        }

        .history-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.6rem;
        }

        body.light .history-label {
            color: #64748b;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            gap: 10px;
            transition: border-color 0.2s;
        }

        body.light .history-item {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .history-item:hover {
            border-color: #475569;
        }

        .history-pwd {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #6366f1;
            word-break: break-all;
            flex: 1;
        }

        .history-copy {
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .history-copy:hover {
            color: #6366f1;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="card-header">
            <div>
                <h1>Password Generator</h1>
                <p class="subtitle">Create a strong, secure password instantly</p>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
        </div>

        <div class="password-box">
            <span id="password-output">Click generate</span>
            <button class="copy-btn" onclick="copyPassword()">Copy</button>
        </div>

        <div class="strength-bar">
            <div class="strength-fill" id="strength-fill"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
        <div id="crack-time"></div>

        <div class="strength-tips" id="strength-tips"></div>

        <div class="option-row">
            <div class="preset-label">Mode</div>
            <div class="mode-switcher">
                <button class="mode-btn active" id="mode-random" onclick="setMode('random')">Random</button>
                <button class="mode-btn" id="mode-pronounceable"
                    onclick="setMode('pronounceable')">Pronounceable</button>
            </div>
            <p class="mode-hint" id="mode-hint">Fully random characters — most secure.</p>
        </div>

        <div class="option-row" id="preset-section">
            <div class="preset-label">Strength preset</div>
            <div class="presets">
                <button class="preset-btn" id="preset-regular" onclick="applyPreset('regular')">Regular</button>
                <button class="preset-btn" id="preset-medium" onclick="applyPreset('medium')">Medium</button>
                <button class="preset-btn active" id="preset-strong" onclick="applyPreset('strong')">Strong</button>
            </div>
        </div>

        <div class="option-row">
            <div class="option-label">
                <span id="length-label">Password length</span>
                <span id="length-value">20</span>
            </div>
            <input type="range" min="6" max="32" value="20" id="length-slider"
                oninput="document.getElementById('length-value').textContent = this.value" />
        </div>

        <div class="toggles" id="toggles-section">
            <div class="toggle-item" onclick="toggleOption('uppercase')">
                <span>Uppercase</span>
                <div class="toggle on" id="toggle-uppercase"></div>
            </div>
            <div class="toggle-item" onclick="toggleOption('lowercase')">
                <span>Lowercase</span>
                <div class="toggle on" id="toggle-lowercase"></div>
            </div>
            <div class="toggle-item" onclick="toggleOption('numbers')">
                <span>Numbers</span>
                <div class="toggle on" id="toggle-numbers"></div>
            </div>
            <div class="toggle-item" onclick="toggleOption('symbols')">
                <span>Symbols</span>
                <div class="toggle on" id="toggle-symbols"></div>
            </div>
        </div>

        <div class="exclude-row" onclick="toggleExclude()">
            <div>
                <span>Exclude similar characters</span>
                <div class="hint">Removes 0, O, l, 1, I to avoid confusion</div>
            </div>
            <div class="toggle" id="toggle-exclude"></div>
        </div>

        <button class="generate-btn" onclick="generatePassword()">Generate Password</button>

        <div class="history-section" id="history-section" style="display:none">
            <div class="history-label">Recent passwords</div>
            <div class="history-list" id="history-list"></div>
        </div>

    </div>

    <script>
        let currentMode = 'random';
        let excludeSimilar = false;
        let isLight = false;
        let history = [];

        const options = {
            uppercase: true,
            lowercase: true,
            numbers: true,
            symbols: true
        };

        const chars = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        const similarChars = /[0Ol1I]/g;
        const consonants = 'bcdfghjklmnprstvwxyz';
        const vowels = 'aeiou';

        function toggleTheme() {
            isLight = !isLight;
            document.body.classList.toggle('light', isLight);
            document.querySelector('.theme-btn').textContent = isLight ? '☾' : '☀';
        }

        function toggleExclude() {
            excludeSimilar = !excludeSimilar;
            document.getElementById('toggle-exclude').classList.toggle('on', excludeSimilar);
            generatePassword();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-random').classList.toggle('active', mode === 'random');
            document.getElementById('mode-pronounceable').classList.toggle('active', mode === 'pronounceable');

            const togglesSection = document.getElementById('toggles-section');
            const presetSection = document.getElementById('preset-section');
            const hint = document.getElementById('mode-hint');
            const lengthLabel = document.getElementById('length-label');

            if (mode === 'pronounceable') {
                hint.textContent = 'Alternates consonants and vowels — easier to remember. ⚠ Not recommended for sensitive accounts as these are easier to guess.';
                lengthLabel.textContent = 'Word length';
                document.getElementById('length-slider').min = 4;
                document.getElementById('length-slider').max = 16;
                document.getElementById('length-slider').value = 8;
                document.getElementById('length-value').textContent = '8';
                togglesSection.querySelectorAll('.toggle-item').forEach(el => el.classList.add('disabled'));
                presetSection.style.opacity = '0.4';
                presetSection.style.pointerEvents = 'none';
            } else {
                hint.textContent = 'Fully random characters — most secure.';
                lengthLabel.textContent = 'Password length';
                document.getElementById('length-slider').min = 6;
                document.getElementById('length-slider').max = 32;
                document.getElementById('length-slider').value = 20;
                document.getElementById('length-value').textContent = '20';
                togglesSection.querySelectorAll('.toggle-item').forEach(el => el.classList.remove('disabled'));
                presetSection.style.opacity = '1';
                presetSection.style.pointerEvents = 'auto';
            }
            generatePassword();
        }

        function generatePronounceablePassword(length) {
            let password = '';
            for (let i = 0; i < length; i++) {
                password += i % 2 === 0
                    ? consonants[Math.floor(Math.random() * consonants.length)]
                    : vowels[Math.floor(Math.random() * vowels.length)];
            }
            return password.charAt(0).toUpperCase() + password.slice(1);
        }

        function toggleOption(type) {
            options[type] = !options[type];
            document.getElementById('toggle-' + type).classList.toggle('on', options[type]);
        }

        function applyPreset(level) {
            ['regular', 'medium', 'strong'].forEach(p => {
                document.getElementById('preset-' + p).classList.remove('active');
            });
            document.getElementById('preset-' + level).classList.add('active');

            if (level === 'regular') {
                document.getElementById('length-slider').value = 8;
                document.getElementById('length-value').textContent = '8';
                options.uppercase = true;
                options.lowercase = true;
                options.numbers = false;
                options.symbols = false;
            } else if (level === 'medium') {
                document.getElementById('length-slider').value = 12;
                document.getElementById('length-value').textContent = '12';
                options.uppercase = true;
                options.lowercase = true;
                options.numbers = true;
                options.symbols = false;
            } else if (level === 'strong') {
                document.getElementById('length-slider').value = 20;
                document.getElementById('length-value').textContent = '20';
                options.uppercase = true;
                options.lowercase = true;
                options.numbers = true;
                options.symbols = true;
            }

            for (let key in options) {
                document.getElementById('toggle-' + key).classList.toggle('on', options[key]);
            }
            generatePassword();
        }

        function generatePassword() {
            const length = parseInt(document.getElementById('length-slider').value);
            let password = '';

            if (currentMode === 'pronounceable') {
                password = generatePronounceablePassword(length);
            } else {
                let charset = '';
                for (let key in options) {
                    if (options[key]) charset += chars[key];
                }
                if (excludeSimilar) charset = charset.replace(similarChars, '');
                if (!charset) {
                    document.getElementById('password-output').textContent = 'Select at least one option';
                    return;
                }
                for (let i = 0; i < length; i++) {
                    password += charset[Math.floor(Math.random() * charset.length)];
                }
            }

            document.getElementById('password-output').textContent = password;
            updateStrength(password);
            addToHistory(password);
        }

        function updateStrength(password) {
            let score = 0;
            const tips = [];

            if (password.length >= 12) score++; else tips.push('Use at least 12 characters');
            if (password.length >= 20) score++; else if (password.length >= 12) tips.push('Consider 20+ characters for extra security');
            if (/[A-Z]/.test(password)) score++; else tips.push('Add uppercase letters');
            if (/[a-z]/.test(password)) score++; else tips.push('Add lowercase letters');
            if (/[0-9]/.test(password)) score++; else tips.push('Add numbers');
            if (/[^A-Za-z0-9]/.test(password)) score++; else tips.push('Add symbols like !@#$');

            const fill = document.getElementById('strength-fill');
            const label = document.getElementById('strength-label');
            const tipsBox = document.getElementById('strength-tips');

            if (score <= 2) {
                fill.style.width = '33%';
                fill.style.background = '#ef4444';
                label.textContent = 'Weak';
                label.style.color = '#ef4444';
            } else if (score <= 4) {
                fill.style.width = '66%';
                fill.style.background = '#f59e0b';
                label.textContent = 'Medium';
                label.style.color = '#f59e0b';
            } else {
                fill.style.width = '100%';
                fill.style.background = '#22c55e';
                label.textContent = 'Strong';
                label.style.color = '#22c55e';
            }

            if (tips.length > 0) {
                tipsBox.innerHTML = tips.map(t => `<p>${t}</p>`).join('');
                tipsBox.classList.add('visible');
            } else {
                tipsBox.classList.remove('visible');
                tipsBox.innerHTML = '';
            }

            // Crack time estimate
            let charset = 0;
            if (/[a-z]/.test(password)) charset += 26;
            if (/[A-Z]/.test(password)) charset += 26;
            if (/[0-9]/.test(password)) charset += 10;
            if (/[^A-Za-z0-9]/.test(password)) charset += 32;

            const combinations = Math.pow(charset || 26, password.length);
            const guessesPerSecond = 1e12;
            const seconds = combinations / guessesPerSecond;

            let crackTime = '';
            if (seconds < 1) crackTime = 'instantly';
            else if (seconds < 60) crackTime = 'less than a minute';
            else if (seconds < 3600) crackTime = Math.floor(seconds / 60) + ' minutes';
            else if (seconds < 86400) crackTime = Math.floor(seconds / 3600) + ' hours';
            else if (seconds < 31536000) crackTime = Math.floor(seconds / 86400) + ' days';
            else if (seconds < 31536000 * 1000) crackTime = Math.floor(seconds / 31536000) + ' years';
            else if (seconds < 31536000 * 1e6) crackTime = Math.floor(seconds / (31536000 * 1000)) + ' thousand years';
            else if (seconds < 31536000 * 1e9) crackTime = Math.floor(seconds / (31536000 * 1e6)) + ' million years';
            else crackTime = 'billions of years';

            const crackEl = document.getElementById('crack-time');
            crackEl.textContent = '⚡ Time to crack: ' + crackTime;
            crackEl.style.color = seconds < 3600 ? '#ef4444' : seconds < 86400 * 30 ? '#f59e0b' : '#22c55e';
        }

        function addToHistory(password) {
            history.unshift(password);
            if (history.length > 5) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const section = document.getElementById('history-section');
            const list = document.getElementById('history-list');

            if (history.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = history.map((pwd, i) => `
        <div class="history-item">
          <span class="history-pwd">${pwd}</span>
          <button class="history-copy" onclick="copyFromHistory(${i})">copy</button>
        </div>
      `).join('');
        }

        function copyFromHistory(index) {
            navigator.clipboard.writeText(history[index]);
            const btns = document.querySelectorAll('.history-copy');
            btns[index].textContent = 'copied!';
            btns[index].style.color = '#22c55e';
            setTimeout(() => {
                btns[index].textContent = 'copy';
                btns[index].style.color = '';
            }, 2000);
        }

        function copyPassword() {
            const pwd = document.getElementById('password-output').textContent;
            if (pwd === 'Click generate' || pwd === 'Select at least one option') return;
            navigator.clipboard.writeText(pwd);
            const btn = document.querySelector('.copy-btn');
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }
    </script>
</body>

</html>
